<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吕一诺 · Yinuo Lyu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#18354a; --blue:#cae7f2; --blue-deep:#4d90ad; --cream:#fff4c9; --paper:#fffdf4; --coral:#ee8f72; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:"DM Sans","Noto Sans SC",sans-serif; overflow-x:hidden; }
    .orb { position:fixed; border-radius:50%; z-index:-1; filter:blur(1px); opacity:.7; }
    .orb.one { width:36vw; height:36vw; background:#e1f3f8; right:-9vw; top:-13vw; }
    .orb.two { width:29vw; height:29vw; background:#fff0b2; left:-11vw; bottom:-11vw; }
    .shell { max-width:1260px; min-height:100vh; margin:auto; padding:28px clamp(22px,5vw,72px) 34px; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; gap:12px; align-items:center; font-weight:700; letter-spacing:.02em; }
    .brand-mark { width:36px; height:36px; display:grid; place-items:center; color:white; background:var(--blue-deep); border-radius:50% 50% 50% 8px; font-family:Caveat,cursive; font-size:23px; transform:rotate(-12deg); }
    .languages { display:flex; padding:4px; background:#fff; border:1px solid #dcebf0; border-radius:99px; box-shadow:0 7px 20px #5b889015; }
    .languages button { appearance:none; border:0; background:transparent; padding:7px 11px; border-radius:99px; color:#63808e; font:600 12px "DM Sans",sans-serif; letter-spacing:.07em; cursor:pointer; transition:.25s; }
    .languages button.active { color:var(--ink); background:var(--cream); }
    .progress { display:flex; gap:8px; margin:clamp(24px,5vh,54px) 0 14px; }
    .progress button { width:38px; height:5px; padding:0; border:0; border-radius:20px; background:#c9dce3; cursor:pointer; transition:.3s; }
    .progress button.active { width:82px; background:var(--coral); }
    main { flex:1; display:grid; align-items:center; }
    .slide { display:none; animation:enter .55s both; }
    .slide.active { display:grid; }
    .intro { grid-template-columns:minmax(260px,.84fr) minmax(0,1.16fr); gap:clamp(32px,7vw,105px); align-items:center; }
    .cover { place-items:center; min-height:min(620px,72vh); text-align:center; position:relative; }
    .cover-inner { max-width:900px; padding:40px 20px; }
    .cover-kicker { margin:0 0 24px; color:var(--blue-deep); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; opacity:0; animation:fadeUp .65s .15s ease forwards; }
    .cover-title { margin:0; font-family:Caveat,"Noto Sans SC",cursive; color:var(--ink); font-size:clamp(54px,8.6vw,118px); font-weight:700; letter-spacing:-.035em; line-height:.94; opacity:0; transform:scale(.72); animation:pop .85s .48s cubic-bezier(.2,1.4,.4,1) forwards; }
    .cover-title span { display:block; }
    .cover-name { display:flex; justify-content:center; align-items:center; gap:8px; margin:22px 0 0; color:var(--coral); font-family:Caveat,"Ma Shan Zheng",cursive; font-size:clamp(24px,3.2vw,42px); font-weight:600; opacity:0; animation:fadeUp .7s 1.3s ease forwards; }
    .cover-name img { display:block; width:clamp(118px,13vw,176px); height:auto; }
    .cover-meet { width:285px; min-height:92px; margin:22px auto 0; color:#668695; font-size:clamp(12px,1.25vw,15px); letter-spacing:.02em; opacity:0; animation:fadeUp .7s 1.65s ease forwards; }
    .cover-meet span { display:block; width:max-content; }
    .cover-meet span:nth-child(1) { margin-left:2px; transform:rotate(-4deg); }
    .cover-meet span:nth-child(2) { margin:11px auto 0; color:var(--coral); font-family:Caveat,cursive; font-size:clamp(20px,2vw,27px); transform:rotate(2deg); }
    .cover-meet span:nth-child(3) { margin:2px 0 0 auto; transform:rotate(-2deg); }
    .cover-scribble { position:absolute; width:clamp(70px,9vw,120px); height:44px; border-top:3px solid var(--blue-deep); border-radius:50%; opacity:0; transform:rotate(-8deg); animation:draw .75s 2s ease forwards; }
    .cover-scribble.left { left:clamp(3%,12vw,17%); top:30%; } .cover-scribble.right { right:clamp(3%,12vw,17%); bottom:27%; transform:rotate(12deg); }
    .portrait-wrap { position:relative; max-width:440px; margin:auto; }
    .portrait-wrap:before { content:""; position:absolute; inset:-17px 19px 18px -16px; background:var(--cream); border-radius:42% 58% 54% 46%; transform:rotate(-5deg); }
    .portrait { position:relative; display:block; width:100%; aspect-ratio:1; object-fit:cover; border-radius:50% 45% 48% 42%; box-shadow:18px 19px 0 #b9deeb; }
    .tape { position:absolute; right:-25px; top:8%; padding:11px 16px; background:#fff; transform:rotate(7deg); box-shadow:0 6px 18px #18354a18; font:600 24px Caveat,cursive; color:var(--blue-deep); }
    .eyebrow { color:var(--blue-deep); font-weight:700; letter-spacing:.13em; font-size:11px; text-transform:uppercase; }
    h1,h2 { margin:8px 0 15px; font-family:Caveat,"Ma Shan Zheng",cursive; color:#16364b; line-height:1; font-weight:700; }
    h1 { font-size:clamp(43px,5.4vw,72px); }
    h1 .chinese-signature { display:block; width:clamp(150px,19vw,250px); height:auto; }
    h2 { font-size:clamp(38px,4.8vw,63px); }
    .content { font-size:clamp(15px,1.3vw,18px); line-height:1.9; color:#315467; max-width:675px; }
    .content p { margin:0 0 15px; }
    .signature { margin-top:22px; font:600 clamp(25px,3vw,37px) Caveat,cursive; color:var(--coral); }
    .story { max-width:900px; margin:auto; position:relative; padding:clamp(28px,5vw,70px); background:#fffefaab; border:1px solid #e5edf0; border-radius:8px 60px 8px 60px; box-shadow:0 18px 55px #3a718013; }
    .story:after { content:""; position:absolute; width:112px; height:112px; border:17px solid var(--blue); border-left:0; border-bottom:0; border-radius:0 100% 0 0; right:25px; top:-25px; opacity:.7; }
    .story .content { max-width:740px; }
    .label { display:inline-block; margin-bottom:6px; padding:6px 11px; border-radius:99px; background:var(--cream); color:#946a28; font-size:12px; font-weight:700; letter-spacing:.08em; }
    footer { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-top:24px; color:#72909e; font-size:12px; letter-spacing:.06em; }
    .nav { display:flex; gap:9px; }
    .nav button { border:1px solid #cce0e8; background:#fff; color:var(--ink); width:43px; height:43px; border-radius:50%; cursor:pointer; font-size:20px; transition:.25s; }
    .nav button:hover { background:var(--blue); transform:translateY(-2px); }
    @keyframes enter { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:none; } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(13px); } to { opacity:1; transform:none; } }
    @keyframes pop { 0% { opacity:0; transform:scale(.72); } 72% { opacity:1; transform:scale(1.05); } 100% { opacity:1; transform:scale(1); } }
    @keyframes draw { from { opacity:0; width:0; } to { opacity:.65; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } }
    @media (max-width:760px) { .shell { padding-top:18px; } .intro { grid-template-columns:1fr; gap:25px; } .portrait-wrap { width:min(72vw,330px); } .tape { right:-17px; } .story { padding:36px 28px 42px; } footer { margin-top:16px; } }
  </style>
</head>
<body>
  <div class="orb one"></div><div class="orb two"></div>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark">Y</span><span>YINUO LYU</span></div>
      <nav class="languages" aria-label="Language selector">
        <button class="active" data-lang="zh">中文</button><button data-lang="en">EN</button><button data-lang="de">DE</button>
      </nav>
    </header>
    <div class="progress" aria-label="Page selector"><button class="active" aria-label="Page 1"></button><button aria-label="Page 2"></button><button aria-label="Page 3"></button><button aria-label="Page 4"></button></div>
    <main>
      <section class="slide cover active">
        <div class="cover-scribble left"></div><div class="cover-scribble right"></div>
        <div class="cover-inner">
          <p class="cover-kicker">A brief introduction. · Yinuo Lyu Personal Homepage</p>
          <div class="cover-title"><span>Welcome to my homepage!</span></div>
          <div class="cover-name"><span>——</span><img src="yinuo-signature-transparent.png" alt="吕一诺"><span>Lynn</span></div>
          <p class="cover-meet"><span>很高兴认识你～</span><span>Nice to meet you~</span><span>Schön, dich kennenzulernen~</span></p>
        </div>
      </section>
      <section class="slide intro">
        <div class="portrait-wrap"><img class="portrait" src="profile.jpg" alt="Portrait of Yinuo Lyu"><span class="tape" data-i18n="hello">hello!</span></div>
        <div><div class="eyebrow" data-i18n="introTag">A LITTLE INTRODUCTION</div><h1 data-i18n="name">吕一诺</h1><div class="content" data-i18n="introText"></div><div class="signature" data-i18n="signature">Nice to meet you.</div></div>
      </section>
      <section class="slide"><article class="story"><span class="label" data-i18n="serviceLabel">SERVICE &amp; COMMUNITY</span><h2 data-i18n="serviceTitle">志愿服务</h2><div class="content" data-i18n="serviceText"></div></article></section>
      <section class="slide"><article class="story"><span class="label" data-i18n="interestLabel">CURIOSITY &amp; CREATIVITY</span><h2 data-i18n="interestTitle">兴趣爱好</h2><div class="content" data-i18n="interestText"></div></article></section>
    </main>
    <footer><span id="counter">01 / 04</span><span data-i18n="hint">Use the arrows to explore</span><div class="nav"><button id="prev" aria-label="Previous page">←</button><button id="next" aria-label="Next page">→</button></div></footer>
  </div>
  <script>
    const copy = {
      zh:{hello:'你好！',introTag:'关于我',name:'<img class="chinese-signature" src="yinuo-signature-transparent.png" alt="吕一诺">',signature:'很高兴认识你。',hint:'点击箭头，继续了解我',serviceLabel:'服务与社群',serviceTitle:'志愿服务',interestLabel:'好奇与创造',interestTitle:'兴趣爱好',introText:'<p>你好！我是吕一诺，上海交通大学外国语学院德语系大二学生。欢迎来到我的个人主页～</p><p>大一入学前，我参加新生骨干训练营，军训时担任小班长。之后被推选为入党积极分子，在第十期“淬火”培训班中担任组长，结业时获评优秀学员；并在 2026 年“全球治理·未来领袖”多语种演讲比赛英语组中获得二等奖。</p><p>目前，我担任 2531 班班长，负责统计信息、领发书籍、整理综测材料等事务，做好师生间的沟通桥梁。同时，我在校学生联合会权益部任干事，收集同学对学校的反馈，也参与组织部门全体会议。今年暑假，我独立牵头社会实践项目，带领 8 名同学开展实地调研；从零对接当地文旅局、采访对象与交通住宿，最终成果获 8 家媒体报道，并被央广网转载。</p>',serviceText:'<p>我始终秉持奉献精神。高中时，我曾赴赞皇县支教两周，在心中埋下服务社会的种子。</p><p>进入大学后，我担任外院开学迎新志愿者、外院校庆志愿者、数理外三院迎新晚会工作人员、第二届跨文化才艺大赛志愿者、“凯原”十佳教师评选活动志愿者，以及 2026 年上海半马志愿者等。</p>',interestText:'<p>我很喜欢小动物。高中时喜欢观鸟，并在家乡石家庄观察、记录了 14 种鸟类，还写过一些科普文章。</p><p>艺术方面，我从小练习钢琴和中国舞，初中起开始学习大提琴，也一直喜欢画画。进入大学后，我加入了学校话剧团；今年年底将是我第一次登台，期待一下吧～</p>'},
      en:{hello:'hello!',introTag:'A LITTLE INTRODUCTION',name:'Yinuo Lyu',signature:'Nice to meet you.',hint:'Use the arrows to explore',serviceLabel:'SERVICE & COMMUNITY',serviceTitle:'Giving back',interestLabel:'CURIOSITY & CREATIVITY',interestTitle:'What I love',introText:'<p>Hi! I’m Yinuo Lyu, a second-year German major at the School of Foreign Languages, Shanghai Jiao Tong University. Welcome to my personal page!</p><p>Before my first year, I joined the new-student leadership camp and served as a squad leader during military training. Later selected as an applicant for Party membership, I led a group in the 10th “Quenching” training programme and was named an outstanding participant. I also won second prize in the English division of the 2026 Global Governance · Future Leaders Multilingual Speech Contest.</p><p>I currently serve as class monitor of Class 2531, coordinating information, books and comprehensive-assessment materials, while connecting classmates and teachers. I also work with the Student Union’s Rights & Interests Department. This summer, I independently led an eight-person field-research social-practice project—from liaising with the local culture and tourism bureau to arranging interviews, travel and accommodation. The project received coverage from eight media outlets and was republished by CNR.</p>',serviceText:'<p>Service has always mattered to me. In high school, I spent two weeks teaching in Zhanhuang County—an experience that planted a lasting commitment to contributing to society.</p><p>At university, I have volunteered for new-student orientation and the School of Foreign Languages anniversary, worked at the joint welcome gala of three schools, and supported the second Intercultural Talent Competition, the “Kaiyuan” Top Ten Teacher selection, and the 2026 Shanghai Half Marathon.</p>',interestText:'<p>I love animals. In high school, I was especially fond of birdwatching: in my hometown of Shijiazhuang, I observed and documented fourteen bird species, and wrote several popular-science pieces.</p><p>Art has always been part of my life. I have practised piano and Chinese dance since childhood, studied cello since middle school, and have always enjoyed drawing. At university I joined the drama club; my first performance on stage will be this year—something to look forward to!</p>'},
      de:{hello:'Hallo!',introTag:'KURZ VORGESTELLT',name:'Yinuo Lyu',signature:'Schön, dich kennenzulernen.',hint:'Mit den Pfeilen weiterentdecken',serviceLabel:'ENGAGEMENT & GEMEINSCHAFT',serviceTitle:'Engagement',interestLabel:'NEUGIER & KREATIVITÄT',interestTitle:'Was ich liebe',introText:'<p>Hallo! Ich bin Yinuo Lyu und studiere im zweiten Jahr Germanistik an der School of Foreign Languages der Shanghai Jiao Tong University. Schön, dass du hier bist!</p><p>Vor meinem ersten Studienjahr nahm ich am Führungscamp für Studienanfänger teil und war während der militärischen Ausbildung Kleingruppenleiterin. Später wurde ich als Parteibewerberin ausgewählt, leitete eine Gruppe im 10. „Quenching“-Trainingsprogramm und wurde als herausragende Teilnehmerin ausgezeichnet. Beim mehrsprachigen Redewettbewerb „Global Governance · Future Leaders“ 2026 gewann ich den zweiten Preis in der englischen Kategorie.</p><p>Als Klassensprecherin der Klasse 2531 koordiniere ich Informationen, Bücher und Unterlagen zur Gesamtbewertung und vermittle zwischen Studierenden und Lehrenden. Zudem arbeite ich in der Abteilung für Rechte und Interessen der Studierendenvertretung. Diesen Sommer leitete ich eigenständig ein sozialpraktisches Feldforschungsprojekt mit acht Kommilitoninnen und Kommilitonen. Die Ergebnisse wurden von acht Medien aufgegriffen und von CNR weiterveröffentlicht.</p>',serviceText:'<p>Engagement ist mir sehr wichtig. Schon in der Oberstufe unterrichtete ich zwei Wochen lang ehrenamtlich im Kreis Zhanhuang – eine Erfahrung, die meinen Wunsch stärkte, der Gesellschaft etwas zurückzugeben.</p><p>An der Universität engagierte ich mich bei der Orientierung neuer Studierender und beim Jubiläum der Fremdsprachenfakultät. Außerdem unterstützte ich die Willkommensgala dreier Fakultäten, den zweiten interkulturellen Talentwettbewerb, die Wahl der zehn besten „Kaiyuan“-Lehrkräfte und den Shanghai-Halbmarathon 2026.</p>',interestText:'<p>Ich mag Tiere sehr. In der Oberstufe begeisterte ich mich besonders für Vogelbeobachtung: In meiner Heimatstadt Shijiazhuang beobachtete und dokumentierte ich vierzehn Vogelarten und schrieb einige populärwissenschaftliche Artikel.</p><p>Kunst begleitet mich schon lange. Seit meiner Kindheit spiele ich Klavier und tanze chinesischen Tanz, seit der Mittelstufe lerne ich Cello; auch Zeichnen liebe ich. An der Universität trat ich der Theatergruppe bei. Mein erster Bühnenauftritt steht Ende dieses Jahres an – ich freue mich darauf!</p>'}
    };
    let page=0, lang='zh'; const slides=[...document.querySelectorAll('.slide')], dots=[...document.querySelectorAll('.progress button')];
    function render(){ const d=copy[lang]; document.documentElement.lang=lang==='zh'?'zh-CN':lang; document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=d[el.dataset.i18n]); slides.forEach((el,i)=>el.classList.toggle('active',i===page)); dots.forEach((el,i)=>el.classList.toggle('active',i===page)); document.getElementById('counter').textContent=`${String(page+1).padStart(2,'0')} / 04`; document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang)); }
    function move(n){ page=(page+n+slides.length)%slides.length; render(); }
    document.getElementById('next').onclick=()=>move(1); document.getElementById('prev').onclick=()=>move(-1); dots.forEach((b,i)=>b.onclick=()=>{page=i;render()}); document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()}); document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
  </script>
</body>
</html>
